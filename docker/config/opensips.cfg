loadmodule "usrloc.so"

####### Module Parameters #######
modparam("mi_fifo", "fifo_name", "/tmp/opensips_fifo")

modparam("tm", "fr_timeout", 2)
modparam("tm", "fr_inv_timeout", 3)
modparam("tm", "restart_fr_on_each_reply", 0)
modparam("tm", "onreply_avp_mode", 1)

modparam("mi_datagram", "socket_name", "udp:0.0.0.0:${MI_PORT}")

modparam("usrloc", "working_mode_preset", "single-instance-no-db")

####### Routing Logic ########

route {
    # 1. ALLOW In-Dialog requests (ACK, BYE, INFO, etc.)
    # These are part of an existing call (they have a 'totag')
    if (has_totag()) {
        # This allows the B2B engine and TM module to see the BYE/ACK
        if (loose_route()) {
            t_relay();
            exit;
        }
        
        # Fallback for ACKs and BYEs that might not have Route headers
        if (is_method("ACK") || is_method("BYE")) {
            t_relay();
            exit;
        }
    }

    # 2. Handle REGISTER
    if (is_method("REGISTER")) {
        # 'save' writes the contact to the in-memory 'location' table
        if (!save("location")) {
            sl_reply_error();
        }
        exit;
    }

    # 2. Handle INVITE on the initial request
    if (is_method("INVITE")) {
        # Record Route is mandatory so the BYE knows to come back to the bridge IP
        record_route();
        
        ua_session_server_init($var(b2b_key), "drbh");
        xlog("Started new call for $var(b2b_key)\n");
        exit;
    }

    # 3. Block actually invalid methods 
    send_reply(405, "Method Not Allowed");
    exit;
}
